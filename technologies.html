    <script>
        /* Pre-paint: language, direction and theme — prevents a flash on load. */
        (function () {
            try {
                var html = document.documentElement;
                var nav = (navigator.language || (navigator.languages && navigator.languages[0]) || "").toLowerCase();
                var browserLang = nav.indexOf("ar") === 0 ? "ar" : (nav ? "en" : null);
                var lang = localStorage.getItem("portfolio.lang") || browserLang || html.dataset.defaultLang || "ar";
                html.lang = lang;
                html.dir = lang === "ar" ? "rtl" : "ltr";
                var theme = localStorage.getItem("portfolio.theme");
                if (theme !== "light" && theme !== "dark") {
                    theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                html.setAttribute("data-theme", theme);
            } catch (e) {}
        })();
    </script>
